<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laisse le destin décider</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f1fafd; --card:#ffffff; --ink:#0f1b2d; --muted:#5b6778; --line:#dcecf3;
    --cyan:#14bdf0; --cyan-d:#0aa3d4; --cyan-soft:#e3f6fd; --cyan-line:#a9e3f7;
    --green:#22c55e; --green-soft:#dcfce7;
    --reel:#e3f6fd; --btn:#14bdf0; --accent:#14bdf0; --text:#0f1b2d; --win:#22c55e;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; overflow:hidden; }
  .hidden { display:none !important; }

  .btn { background:var(--btn); color:#fff; border:none; border-radius:12px; padding:12px 20px; font:600 16px 'Inter',sans-serif; cursor:pointer; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15), 0 6px 16px rgba(0,0,0,.12); transition:transform .08s, filter .15s; }
  .btn:hover { filter:brightness(1.05); }
  .btn:active { transform:translateY(1px); }
  .btn.soft { background:var(--cyan-soft); color:var(--cyan-d); border:1px solid var(--cyan-line); box-shadow:none; }

  /* ---------- SETUP ---------- */
  #setup { height:100%; overflow:auto; display:flex; justify-content:center; padding:48px 16px; }
  .wrap { width:100%; max-width:620px; }
  .wrap h1 { font-size:clamp(28px,5vw,40px); font-weight:800; letter-spacing:-1.2px; margin-bottom:8px; }
  .wrap h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:16px; margin-bottom:24px; }
  .card { color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px; box-shadow:0 4px 24px rgba(15,27,45,.05); }
  label { display:block; font-size:14px; font-weight:700; margin:20px 0 8px; }
  label:first-child { margin-top:0; }
  input[type=text], select { width:100%; padding:12px 14px; background:#fff; border:1px solid var(--line); color:var(--ink); border-radius:12px; font:16px 'Inter',sans-serif; outline:none; }
  input[type=text]:focus, select:focus { border-color:var(--cyan); box-shadow:0 0 0 3px var(--cyan-soft); }
  .row { display:flex; gap:8px; }
  .row input { flex:1; }
  .hint { font-size:13px; color:var(--muted); margin-top:6px; }
  ul#items { list-style:none; margin-top:12px; }
  ul#items li { display:flex; align-items:center; gap:10px; background:var(--cyan-soft); border:1px solid var(--cyan-line); border-radius:12px; padding:10px 14px; margin-bottom:8px; font-size:15px; font-weight:500; }
  ul#items li span { flex:1; }
  ul#items li button { background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; }
  ul#items li button:hover { color:#e11d48; }
  .colors { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:8px; }
  .colors div { display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:12px; padding:8px 10px; font-size:14px; font-weight:500; }
  .colors input { width:34px; height:34px; border:none; background:none; padding:0; cursor:pointer; }
  .linkbtn { background:none; border:none; color:var(--muted); text-decoration:underline; font:13px 'Inter',sans-serif; cursor:pointer; margin-top:8px; }
  .play { width:100%; margin-top:24px; font-size:18px; padding:16px; }

  /* ---------- GAME ---------- */
  #game { height:100%; display:flex; flex-direction:column; align-items:center; padding:3vh 3vw; }
  #title { font-weight:800; font-size:clamp(26px,4.5vw,56px); letter-spacing:-1.5px; outline:none; text-align:center; margin-bottom:2.5vh; cursor:text; }
  #title .accent { color:var(--accent); }
  #frame { width:100%; max-width:1400px; flex:1; background:color-mix(in srgb, var(--text) 6%, var(--bg)); border:1px solid color-mix(in srgb, var(--text) 12%, var(--bg)); border-radius:24px; padding:12px; box-shadow:0 8px 32px rgba(15,27,45,.06); display:flex; }
  #reel { position:relative; flex:1; background:var(--reel); border:1px solid rgba(0,0,0,.08); overflow:hidden; border-radius:16px; }
  #strip { position:absolute; z-index:2; left:0; right:0; top:0; will-change:transform; }
  .cell { display:flex; align-items:center; justify-content:center; font-weight:800; letter-spacing:-1px; color:var(--text); opacity:.4; text-transform:uppercase; white-space:nowrap; transition:color .2s; }
  #band { position:absolute; z-index:1; left:10px; right:10px; pointer-events:none; border-radius:14px; background:#fff; border:2px solid var(--cyan-line); transition:background .25s, box-shadow .25s, border-color .25s; }
  #band.spinning { background:var(--btn); border-color:var(--btn); box-shadow:0 6px 30px rgba(0,0,0,.2); }
  #band.win { background:var(--win); border-color:var(--win); box-shadow:0 6px 34px rgba(0,0,0,.2); }
  .cell.winner { color:#fff; opacity:1; }
  #fadeTop,#fadeBot { position:absolute; z-index:3; left:0; right:0; height:24%; pointer-events:none; }
  #fadeTop { top:0; background:linear-gradient(var(--reel),transparent); }
  #fadeBot { bottom:0; background:linear-gradient(transparent,var(--reel)); }
  #controls { margin-top:2.5vh; text-align:center; }
  #spinBtn { font-size:18px; padding:14px 48px; }
  #spinBtn:disabled { opacity:.5; cursor:default; }
  .press { font-size:13px; color:var(--muted); margin-top:12px; }
  .press kbd { border:1px solid var(--line); background:#fff; border-radius:6px; padding:2px 8px; color:var(--ink); font:600 12px 'Inter',sans-serif; margin:0 4px; }
  #topBtns { position:fixed; top:16px; right:16px; display:flex; gap:8px; z-index:10; }
  #topBtns button { background:#fff; border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:8px 14px; font:600 14px 'Inter',sans-serif; cursor:pointer; }
  #topBtns button:hover { border-color:var(--cyan); }
</style>
</head>
<body>

<div id="setup">
  <div class="wrap">
    <h1>Laisse le destin <span>décider.</span></h1>
    <p class="sub">Add your options, choose how it lands, then press play.</p>
    <div class="card">
      <label>Title <span style="font-weight:400;color:var(--muted)">(the last word is highlighted)</span></label>
      <input type="text" id="titleInput" value="Laisse le destin décider.">

      <label>Options</label>
      <div class="row">
        <input type="text" id="newItem" placeholder="Type an option and press Enter">
        <button class="btn" id="addBtn">Add</button>
      </div>
      <div class="hint">Tip: paste a list (one per line) to add them all at once.</div>
      <ul id="items"></ul>

      <label>Where should it land?</label>
      <select id="rigSelect"></select>

      <label>Colors</label>
      <div class="colors" id="colors"></div>
      <button class="linkbtn" id="resetColors">Reset to default colors</button>

      <button class="btn play" id="playBtn">▶ Play</button>
    </div>
  </div>
</div>

<div id="game" class="hidden">
  <div id="topBtns">
    <button id="soundBtn">🔊</button>
    <button id="backBtn">Edit</button>
  </div>
  <h1 id="title" contenteditable="true" spellcheck="false"></h1>
  <div id="frame"><div id="reel">
    <div id="strip"></div>
    <div id="fadeTop"></div><div id="fadeBot"></div>
    <div id="band"></div>
  </div></div>
  <div id="controls">
    <button class="btn" id="spinBtn">⟳ Lancer</button>
    <div class="press">Appuyez sur <kbd>Espace</kbd> pour lancer</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const STORE = 'destin-wheel-v1';
let state = { title:'Laisse le destin décider.', items:['Trading','Dropshipping','YouTube Kids','E-Commerce','Affiliate Marketing'], rig:'random', muted:false };
try { Object.assign(state, JSON.parse(localStorage.getItem(STORE)) || {}); } catch(e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e) {} };

/* ---------- SETUP ---------- */
function renderItems() {
  const ul = $('items'); ul.innerHTML = '';
  state.items.forEach((t,i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span></span><button title="Remove">✕</button>`;
    li.querySelector('span').textContent = t;
    li.querySelector('button').onclick = () => { state.items.splice(i,1); if (state.rig === t) state.rig='random'; save(); renderItems(); };
    ul.appendChild(li);
  });
  const sel = $('rigSelect'); sel.innerHTML = '<option value="random">🎲 Random (up to fate)</option>';
  state.items.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = '🎯 Always: ' + t; sel.appendChild(o); });
  sel.value = state.items.includes(state.rig) ? state.rig : 'random';
}
function addItems(text) {
  text.split(/\n|,(?=\s*\S)/).map(s => s.trim()).filter(Boolean).forEach(s => state.items.push(s));
  save(); renderItems();
}
$('addBtn').onclick = () => { addItems($('newItem').value); $('newItem').value=''; $('newItem').focus(); };
$('newItem').addEventListener('keydown', e => { if (e.key==='Enter') $('addBtn').click(); });
$('newItem').addEventListener('paste', e => {
  const t = e.clipboardData.getData('text');
  if (t.includes('\n')) { e.preventDefault(); addItems(t); }
});
$('rigSelect').onchange = e => { state.rig = e.target.value; save(); };
$('titleInput').value = state.title;
$('titleInput').oninput = e => { state.title = e.target.value; save(); };
$('playBtn').onclick = () => {
  if (state.items.length < 2) { alert('Add at least 2 options.'); return; }
  $('setup').classList.add('hidden'); $('game').classList.remove('hidden');
  renderTitle(); buildReel();
};
renderItems();

/* ---------- COLORS ---------- */
const COLORS = [
  ['bg','Page background','#f1fafd'],
  ['reel','Spinner background','#e3f6fd'],
  ['text','Text','#0f1b2d'],
  ['accent','Highlighted word','#14bdf0'],
  ['btn','Buttons & spin bar','#14bdf0'],
  ['win','Winner bar','#22c55e'],
];
state.colors = state.colors || {};
function applyColors() {
  COLORS.forEach(([k,,def]) => document.documentElement.style.setProperty('--'+k, state.colors[k] || def));
}
function renderColors() {
  const box = $('colors'); box.innerHTML = '';
  COLORS.forEach(([k,name,def]) => {
    const d = document.createElement('div');
    d.innerHTML = '<input type="color"><span></span>';
    d.querySelector('span').textContent = name;
    const inp = d.querySelector('input'); inp.value = state.colors[k] || def;
    inp.oninput = () => { state.colors[k] = inp.value; applyColors(); save(); };
    box.appendChild(d);
  });
}
$('resetColors').onclick = () => { state.colors = {}; save(); applyColors(); renderColors(); };
applyColors(); renderColors();

/* ---------- TITLE ---------- */
function renderTitle() {
  const words = state.title.trim().split(/\s+/);
  const last = words.pop() || '';
  const t = $('title'); t.textContent = words.join(' ') + (words.length ? ' ' : '');
  const s = document.createElement('span'); s.className='accent'; s.textContent = last; t.appendChild(s);
}
$('title').addEventListener('blur', () => { state.title = $('title').textContent; $('titleInput').value = state.title; save(); renderTitle(); });
$('title').addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); $('title').blur(); } });

/* ---------- REEL ---------- */
const VISIBLE = 5;
let rowH = 0, pos = 0, spinning = false, cells = [];
const REPEAT = 60;

function buildReel() {
  const reel = $('reel'), strip = $('strip');
  rowH = reel.clientHeight / VISIBLE;
  const n = state.items.length;
  strip.innerHTML = ''; cells = [];
  const longest = Math.max(...state.items.map(s => s.length));
  const fs = Math.min(rowH * 0.6, reel.clientWidth * 0.9 / (longest * 0.7));
  for (let r = 0; r < REPEAT; r++) state.items.forEach(t => {
    const c = document.createElement('div'); c.className='cell';
    c.style.height = rowH+'px'; c.style.fontSize = fs+'px'; c.textContent = t;
    strip.appendChild(c); cells.push(c);
  });
  const band = $('band'); band.style.top = rowH*2+'px'; band.style.height = rowH+'px';
  band.className = '';
  pos = ((pos % n) + n) % n + n * 2; // keep index, start near top of strip
  setStrip(pos, 0);
}
function setStrip(p, blur) {
  // p = index of item sitting in the centre row (row 2)
  $('strip').style.transform = `translateY(${(2 - p) * rowH}px)`;
  $('strip').style.filter = blur > 0.5 ? `blur(${Math.min(blur,8)}px)` : 'none';
}
window.addEventListener('resize', () => { if (!$('game').classList.contains('hidden') && !spinning) buildReel(); });

function spin() {
  if (spinning) return;
  spinning = true; $('spinBtn').disabled = true;
  audio(); cells.forEach(c => c.classList.remove('winner'));
  const n = state.items.length;
  const targetIdx = state.items.includes(state.rig) ? state.items.indexOf(state.rig) : Math.floor(Math.random()*n);
  const start = n * 2 + (Math.round(pos) % n);
  const loops = 8 + Math.floor(Math.random()*3);
  const end = n * 2 + loops * n + targetIdx + (targetIdx < start % n ? 0 : 0);
  let target = n*2 + targetIdx; while (target < start + loops*n) target += n;
  const dist = target - start;
  const dur = 5200 + Math.random()*800;
  const band = $('band'); band.className = 'spinning';
  let t0 = null, lastTick = Math.floor(start), prevP = start;
  const ease = t => 1 - Math.pow(1 - t, 4);
  function frame(ts) {
    if (t0 === null) t0 = ts;
    const t = Math.min((ts - t0)/dur, 1);
    const p = start + dist * ease(t);
    const speed = (p - prevP) * rowH; prevP = p;
    setStrip(p, speed * 0.15);
    const idx = Math.floor(p + 0.5);
    if (idx !== lastTick) { lastTick = idx; tick(Math.min(1, speed/40)); }
    if (t < 1) requestAnimationFrame(frame);
    else {
      pos = target; setStrip(pos, 0);
      cells[target].classList.add('winner');
      band.className = 'win'; winSound();
      spinning = false; $('spinBtn').disabled = false;
      pos = n*2 + targetIdx; // reset to top silently later
      setTimeout(() => { if (!spinning) { cells.forEach(c=>c.classList.remove('winner')); setStrip(pos,0); cells[pos].classList.add('winner'); } }, 50);
    }
  }
  requestAnimationFrame(frame);
}
$('spinBtn').onclick = spin;
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !$('game').classList.contains('hidden') && document.activeElement !== $('title')) { e.preventDefault(); spin(); }
});
$('backBtn').onclick = () => { if (spinning) return; $('game').classList.add('hidden'); $('setup').classList.remove('hidden'); renderItems(); };

/* ---------- SOUND ---------- */
let ctx = null;
function audio() { if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if (ctx.state==='suspended') ctx.resume(); return ctx; }
function tone(freq, start, dur, vol, type='sine') {
  if (state.muted) return;
  const a = audio(), o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, start); g.gain.linearRampToValueAtTime(vol, start+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
  o.connect(g).connect(a.destination); o.start(start); o.stop(start+dur+0.02);
}
function tick(fast) {
  if (state.muted || !ctx) return;
  const t = ctx.currentTime;
  tone(1500 + fast*400, t, 0.06, 0.18, 'square');   // "ding" click
  tone(3000, t, 0.03, 0.05, 'sine');
}
function winSound() {
  if (state.muted || !ctx) return;
  const t = ctx.currentTime + 0.05;
  [523.25, 659.25, 783.99, 1046.5].forEach((f,i) => { tone(f, t+i*0.09, 0.5, 0.22, 'triangle'); tone(f*2, t+i*0.09, 0.3, 0.05, 'sine'); });
  [1046.5,1318.5,1568].forEach(f => tone(f, t+0.4, 1.3, 0.12, 'triangle')); // final chord
}
function renderSoundBtn() { $('soundBtn').textContent = state.muted ? '🔇' : '🔊'; }
$('soundBtn').onclick = () => { state.muted = !state.muted; save(); renderSoundBtn(); };
renderSoundBtn();
</script>
</body>
</html>
